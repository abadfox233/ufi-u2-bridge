# dnsmasq 配置: DHCPv4(88段) + RA/DHCPv6 + DNS(53, 域名劫持)
# port 不能重复出现: DHCP 服务不依赖 port(DHCP 用 67), port 只管 DNS
interface=br0
bind-dynamic
no-resolv
dhcp-range=192.168.88.50,192.168.88.150,255.255.255.0,12h
dhcp-option=option:router,192.168.88.1
dhcp-option=option:dns-server,192.168.88.1
dhcp-authoritative
dhcp-leasefile=/data/kano_bridge/leases
log-facility=/data/kano_bridge/logs/dnsmasq.log
log-dhcp
pid-file=/data/kano_bridge/dnsmasq.pid
enable-ra
dhcp-range=::,constructor:br0,ra-stateless,12h
ra-param=br0,mtu:1500,120,600
# --- DNS 服务 + 域名劫持 (iStore 风格) ---
# dnsmasq 同时监听 88.1:53; 客户端 DHCP 拿到的 DNS=88.1 → 查询直达本机
# 劫持条目: dnsmasq.hosts.conf 里 address=/域名/IP (面板可管理, 改后 -r 生效)
port=53
listen-address=192.168.88.1
except-interface=lo
server=123.123.123.123
server=123.123.123.124
conf-file=/data/kano_bridge/dnsmasq.hosts.conf
no-hosts
